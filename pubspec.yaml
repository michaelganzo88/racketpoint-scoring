name: racketpoint_scoring
description: >-
  RacketPoint padel scoring engine (C99).
  Exposed to Flutter via dart:ffi for macOS, Linux and Windows.
version: 0.2.0

environment:
  sdk: ^3.0.0
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

flutter:
  plugin:
    platforms:
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
